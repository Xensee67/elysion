name: Build Elysion APK (OnePlus 15)

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Pillow for icon generation
        run: pip3 install -q pillow
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-512.png icon-1024.png www/
      - name: Install Capacitor & add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Apply Elysion icons & Native MediaSession with Seek
        run: python3 android-native/patch_android.py
      - name: Build Elysion v2.6 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Elysion-v2.6-OnePlus15-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
